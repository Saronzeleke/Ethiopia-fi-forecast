name: Python Tests

on:
  push:
    branches: [ main, task-1, task-2 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Create test data directory
      run: mkdir -p data/raw
    
    - name: Create test CSV files
      run: |
        echo "record_id,record_type,pillar,indicator,indicator_code,value_numeric,observation_date" > data/raw/test_data.csv
        echo "REC_0001,observation,ACCESS,Account Ownership Rate,ACC_OWNERSHIP,22.0,2014-12-31" >> data/raw/test_data.csv
        echo "REC_0002,observation,ACCESS,Account Ownership Rate,ACC_OWNERSHIP,35.0,2017-12-31" >> data/raw/test_data.csv
        echo "EVT_0001,event,,Telebirr Launch,EVT_TELEBIRR,,2021-05-17" >> data/raw/test_data.csv
        
        echo "field,code,description" > data/raw/test_ref_codes.csv
        echo "record_type,observation,Actual measured value" >> data/raw/test_ref_codes.csv
        echo "record_type,event,Policy launch" >> data/raw/test_ref_codes.csv
    
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: true